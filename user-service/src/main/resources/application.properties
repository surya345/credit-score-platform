server.port=${SERVER_PORT:8081}
spring.application.name=user-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/credit_users?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:credit_users}
spring.datasource.password=${DB_PASSWORD:local-dev-only}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/common,classpath:db/migration
spring.jackson.deserialization.accept-float-as-int=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.consumer.group-id=user-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.security.issuer=${OIDC_ISSUER:http://localhost:8180/realms/credit-platform}
app.security.jwk-set-uri=${OIDC_JWKS:http://localhost:8180/realms/credit-platform/protocol/openid-connect/certs}
app.events.enabled=false
app.users-url=${USERS_URL:http://localhost:8081}
app.demo-seed=${DEMO_SEED:true}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs
