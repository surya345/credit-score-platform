server.port=${SERVER_PORT:8080}
spring.application.name=gateway
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s
app.users-url=${USERS_URL:http://localhost:8081}
app.data-url=${DATA_URL:http://localhost:8082}
app.scores-url=${SCORES_URL:http://localhost:8083}
app.reports-url=${REPORTS_URL:http://localhost:8084}
app.security.issuer=${OIDC_ISSUER:http://localhost:8180/realms/credit-platform}
app.security.jwk-set-uri=${OIDC_JWKS:http://localhost:8180/realms/credit-platform/protocol/openid-connect/certs}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs
